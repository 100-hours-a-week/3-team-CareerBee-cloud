services:
  mysql:
    image: mysql:8.4.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - /home/ubuntu/mysql/data:/var/lib/mysql
      - /home/ubuntu/mysql/conf:/etc/mysql/conf.d
    logging:
      driver: fluentd
      options:
        fluentd-address: fluent-bit:24224
        tag: db/{{.Name}}
    restart: always
    networks:
      - app-network
      
  redis:
    image: redis:6.2.14
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - /home/ubuntu/redis/data:/data
    logging:
      driver: fluentd
      options:
        fluentd-address: fluent-bit:24224
        tag: db/{{.Name}}
    restart: always
    networks:
      - app-network

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/etc/fluent-bit/fluent-bit.conf:ro
      - /var/log:/var/log:ro
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
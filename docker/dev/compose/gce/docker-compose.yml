services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    network_mode: host
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=ap-northeast-2
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/trim_log.lua:/fluent-bit/etc/trim_log.lua:ro
      - /var/log/syslog:/var/log/syslog:ro
    restart: always

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    network_mode: host
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: [
      "--model", "/mnt/ssd/aya-expanse-8b",
      "--tokenizer", "/mnt/ssd/aya-expanse-8b",
      "--dtype", "bfloat16",
      "--max-model-len", "4096",
      "--port", "8001",
      "--gpu-memory-utilization", "0.85"
    ]
    volumes:
      - ${MOUNT_DIR}/aya-expanse-8b:${MOUNT_DIR}/aya-expanse-8b
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: gce/{{.Name}}
    depends_on:
      - fluent-bit
      
  ai-server:
    image: ${ECR_REGISTRY}/ai-server:${TAG}
    container_name: ai-server
    network_mode: host
    restart: always
    env_file:
      - /home/ubuntu/.env
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: gce/{{.Name}}
    depends_on:
      - fluent-bit
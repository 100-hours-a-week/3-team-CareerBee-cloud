services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ports:
      - "8001:8001"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: [
      "--model", "/mnt/ssd/aya-expanse-8b",
      "--tokenizer", "/mnt/ssd/aya-expanse-8b",
      "--dtype", "bfloat16",
      "--max-model-len", "4096",
      "--port", "8001",
      "--gpu-memory-utilization", "0.85"
    ]
    volumes:
      - ${MOUNT_DIR}/aya-expanse-8b:${MOUNT_DIR}/aya-expanse-8b
    restart: always

  ai-server:
    image: ${ECR_REGISTRY}/ai-server:${TAG}
    container_name: ai-server
    env_file:
      - /home/ubuntu/.env
    ports:
      - "8000:8000"
    restart: always

services:
  prometheus:
    container_name: prometheus
    network_mode: host
    image: prom/prometheus:latest
    volumes:
      - /mnt/ssd/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    network_mode: host
    ports:
      - "3000:3000"
[SERVICE]
  Flush        15
  Daemon       Off
  Log_Level    info

[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224

[OUTPUT]
  Name cloudwatch_logs
  Match gce/*
  region ap-northeast-2
  log_group_name careerbee/gce
  log_stream_prefix gce/
  auto_create_group true

[INPUT]
  Name   tail
  Path   /var/log/syslog
  Tag    log.startup
  DB     /var/log/flb_tail_startup.db
  Read_from_Head true

[FILTER]
  Name   grep
  Match  log.startup
  Regex  log .*startup-script.*

[FILTER]
  Name   lua
  Match  log.startup
  script /etc/fluent-bit/trim_log.lua
  call   trim

[OUTPUT]
  Name cloudwatch_logs
  Match log.startup
  region ap-northeast-2
  log_group_name careerbee/gce
  log_stream_name gce/startup
  auto_create_group true
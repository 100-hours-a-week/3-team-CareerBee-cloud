server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/log/promtail/positions.yaml

clients:
  - url: http://192.168.110.100:3100/loki/api/v1/push

scrape_configs:
  - job_name: system-gce
    static_configs:
      - targets: ['localhost']
        labels:
          job: system-gce
          __path__: /var/log/syslog
    pipeline_stages:
      - match:
          selector: '{job="system-gce"}'
          stages:
            - regex:
                expression: '.*startup-script.*'
            - output:
                source: entry
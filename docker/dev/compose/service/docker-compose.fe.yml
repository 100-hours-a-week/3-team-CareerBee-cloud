services:
  frontend:
    image: ${ECR_REGISTRY}/frontend:${TAG}
    container_name: frontend
    network_mode: host
    platform: linux/amd64
    expose:
      - "80"
    volumes:
      - /home/ubuntu/nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf
    command: ["nginx", "-g", "daemon off;"]
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: service/{{.Name}}
    restart: always
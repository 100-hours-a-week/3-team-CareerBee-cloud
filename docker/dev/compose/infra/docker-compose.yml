services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - /home/ubuntu/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - /home/ubuntu/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${DB_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${DB_PASSWORD}
    ports:
      - "3000:3000"
    restart: always

  webhook:
    container_name: webhook
    build: ./webhook
    volumes:
      - .:/app
      - /home/ubuntu/.env:/home/ubuntu/.env:ro
      - /home/ubuntu/.ssh/id_rsa:/home/ubuntu/.ssh/id_rsa:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "webhook.py"]
    environment:
      - ECR_REGISTRY=${ECR_REGISTRY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - MOUNT_DIR=${MOUNT_DIR}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
    working_dir: /app/webhook
    ports:
      - "5000:5000"
    restart: always
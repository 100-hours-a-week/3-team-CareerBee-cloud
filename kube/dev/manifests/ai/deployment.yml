apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels:
    app: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      nodeSelector:
        node-role.kubernetes.io/service: ai
      containers:
        - name: ai
          image: 474668404452.dkr.ecr.ap-northeast-2.amazonaws.com/ai-server:latest
          ports:
            - containerPort: 80
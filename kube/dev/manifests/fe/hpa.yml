apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fe-hpa
  namespace: fe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fe
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  labels:
    app: be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      nodeSelector:
        node-role.kubernetes.io/service: service
      containers:
        - name: be
          image: 474668404452.dkr.ecr.ap-northeast-2.amazonaws.com/backend:latest
          ports:
            - containerPort: 80
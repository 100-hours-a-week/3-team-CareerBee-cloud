- name: Create namespace for AI workloads
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ai

- name: Taint AI nodes
  ansible.builtin.command: >
    kubectl taint nodes {{ item }} node-role=ai:NoSchedule --overwrite
  loop: "{{ groups['ai_nodes'] }}"

- name: Apply ArgoCD Application for AI
  kubernetes.core.k8s:
    state: present
    src: files/apps/ai.yml
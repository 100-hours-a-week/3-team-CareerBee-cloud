- name: Initialize kubeadm
  shell: kubeadm init --pod-network-cidr=192.168.0.0/16
  register: kubeadm_output
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create join.sh
  shell: |
    kubeadm token create --print-join-command > /tmp/join.sh
    chmod +x /tmp/join.sh
    aws s3 cp /tmp/join.sh s3://s3-careerbee-dev-infra/kube/join.sh

- name: Set up kubeconfig for root user
  shell: |
    mkdir -p /root/.kube
    cp /etc/kubernetes/admin.conf /root/.kube/config

- name: Check if helm is installed
  command: which helm
  register: helm_check
  ignore_errors: true

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  when: helm_check.rc != 0

- name: Install Helm
  command: /tmp/get_helm.sh
  when: helm_check.rc != 0

- name: Install Calico via kubectl apply
  shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml

- name: Wait for Calico-node pods to be created
  shell: kubectl get pods -n kube-system -l k8s-app=calico-node --no-headers
  register: calico_pods_check
  until: calico_pods_check.stdout != ""
  retries: 30
  delay: 10
  changed_when: false

- name: Check if IP_AUTODETECTION_METHOD exists in Calico DaemonSet
  shell: kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.containers[0].env[] | select(.name=="IP_AUTODETECTION_METHOD")'
  register: ip_detection_check
  ignore_errors: true
  changed_when: false

- name: Add IP_AUTODETECTION_METHOD to Calico DaemonSet (if not exists)
  kubernetes.core.k8s_json_patch:
    kind: DaemonSet
    namespace: kube-system
    name: calico-node
    patch:
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IP_AUTODETECTION_METHOD
          value: "skip-interface=tailscale.*"
  when: ip_detection_check.stdout == ""

- name: Get IP_AUTODETECTION_METHOD index in Calico DaemonSet
  shell: kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.containers[0].env | to_entries | map(select(.value.name=="IP_AUTODETECTION_METHOD")) | .[0].key'
  register: ip_detection_index
  ignore_errors: true
  changed_when: false
  when: ip_detection_check.stdout != ""

- name: Replace IP_AUTODETECTION_METHOD in Calico DaemonSet (if exists)
  kubernetes.core.k8s_json_patch:
    kind: DaemonSet
    namespace: kube-system
    name: calico-node
    patch:
      - op: replace
        path: /spec/template/spec/containers/0/env/{{ ip_detection_index.stdout }}/value
        value: "skip-interface=tailscale.*"
  when: ip_detection_check.stdout != ""

- name: Wait until Calico-node pods are ready
  shell: kubectl wait --for=condition=Ready pod -l k8s-app=calico-node -n kube-system --timeout=600s
  register: calico_wait
  changed_when: false
  failed_when: calico_wait.rc != 0

- name: Load Terraform output from JSON
  set_fact:
    tf_output: "{{ lookup('file', 'tf_output.json') | from_json }}"
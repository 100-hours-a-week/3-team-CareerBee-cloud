#######################
# Helm Repository 추가
#######################
- name: Add Bitnami Helm repository
  community.kubernetes.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami
    
#######################
# MySQL 설치
#######################
- name: Create MySQL namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: mysql

- name: Install MySQL via Helm
  community.kubernetes.helm:
    name: mysql
    chart_ref: bitnami/mysql
    release_namespace: mysql
    create_namespace: false
    values_files:
      - files/db/values.mysql.yml
    wait: true
    timeout: 300s

#######################
# Redis 설치
#######################
- name: Create Redis namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: redis

- name: Install Redis via Helm
  community.kubernetes.helm:
    name: redis
    chart_ref: bitnami/redis
    release_namespace: redis
    create_namespace: false
    values_files:
      - files/db/values.redis.yml
    wait: true
    timeout: 300s
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fe
  namespace: argocd
spec:
  destination:
    namespace: fe
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/3-team-CareerBee-cloud.git
    targetRevision: develop
    path: manifests/fe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-nginx-config
  namespace: proxy
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://10.0.110.10:30443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
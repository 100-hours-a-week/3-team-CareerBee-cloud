- name: "All Kubernetes Nodes Setup"
  hosts: all
  become: yes
  roles:
    - common

- name: "Install Kubernetes Master"
  hosts: master
  become: yes
  roles:
    - master

- name: "Setup ArgoCD"
  hosts: master
  become: yes
  roles:
    - argocd

- name: "Setup Database Nodes"
  hosts: master
  become: yes
  roles:
    - db

- name: "Setup Kubernetes Workers"
  hosts: master
  become: yes
  roles:
    - ai
    - ai_ingress
    - fe
    - be